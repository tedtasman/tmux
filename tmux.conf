# ---------------------
# Prefix Key
# ---------------------
# Change prefix from Ctrl+b to Ctrl+a (GNU Screen compatible)
unbind C-b
set -g prefix M-w
set -g prefix2 M-o
bind M-w send-prefix
bind M-o send-prefix -2


# ---------------------
# Display
# ---------------------
# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Automatically rename windows
setw -g automatic-rename on
setw -g automatic-rename-format '#{pane_current_command}'

# Set terminal title
set -g set-titles on
set -g set-titles-string "#S - #W"

# ---------------------
# General Settings
# ---------------------
# Remove delay after pressing Escape (critical for vim/neovim), nonzero for Meta key
set -sg escape-time 10

# Increase scrollback buffer
set -g history-limit 50000

# Increase message display time
set -g display-time 1000

# Allow repeatable key presses for 500ms
set -g repeat-time 500

# ---------------------
# Terminal & Colors
# ---------------------
# Enable 256-color support
set -g default-terminal "tmux-256color"

# Enable true color (24-bit)
set -ga terminal-overrides ",xterm-256color:Tc"

# ---------------------
# Mouse
# ---------------------
# Enable mouse support (tmux 2.1+)
set -g mouse on

# ---------------------
# Key Bindings
# ---------------------
# Reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Intuitive split keys (preserving current path)
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ---------------------
# Copy and paste
# ---------------------
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down
setw -g mode-keys vi
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection c"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"


# ---------------------
# Color Theme
# ---------------------
PRIMARY="#f9805f"
BG="#352826"
FG="#976f65"
DEFAULT="default" # default is transparent or something idk

# ---------------------
# Status Bar
# ---------------------
# bottom bar
STATUS_BG=$BG
STATUS_FG=$FG
# left side
STATUS_SESSION=$FG # session name
STATUS_INFO=$PRIMARY # Z, *, etc...
# windows
STATUS_WINDOW_ACTIVE_BG=$PRIMARY
STATUS_WINDOW_ACTIVE_FG=$BG
STATUS_WINDOW_INACTIVE_BG=$BG
STATUS_WINDOW_INACTIVE_FG=$FG

# Status bar colors
set -g status-style "bg=$STATUS_BG,fg=$STATUS_FG"

# Left side: session name
set -g status-left-length 40
set -g status-left " #[fg=$STATUS_SESSION]#S  #[fg=$STATUS_INFO]#F"

# Right side: date, time, and hostname
set -g status-right-length 60
set -g status-right "%l:%M  %D "

# Window list
setw -g status-justify absolute-centre

# Active window styling in status bar
setw -g window-status-current-style "bg=$STATUS_WINDOW_ACTIVE_BG,fg=$STATUS_WINDOW_ACTIVE_FG"
setw -g window-status-current-format " #I: #W "

# Inactive window styling
setw -g window-status-style "bg=$STATUS_WINDOW_INACTIVE_BG,fg=$STATUS_WINDOW_INACTIVE_FG"
setw -g window-status-format " #I: #W "

# Update the status bar every second (for clock)
set -g status-interval 1

# ---------------------
# Pane Border
# ---------------------
# lines
PANE_BORDER_ACTIVE_FG=$PRIMARY
PANE_BORDER_ACTIVE_BG=$DEFAULT
PANE_BORDER_INACTIVE_FG=$FG
PANE_BORDER_INACTIVE_BG=$DEFAULT
# title
PANE_ACTIVE_COLON=$PRIMARY
PANE_ACTIVE_PATH=$PRIMARY
PANE_ACTIVE_COMMAND=$FG
PANE_INACTIVE_COLON=$FG
PANE_INACTIVE_PATH=$FG
PANE_INACTIVE_COMMAND=$FG

set -g pane-border-lines single
set -g pane-border-status top
set -g pane-active-border-style "fg=$PANE_BORDER_ACTIVE_FG,bg=$PANE_BORDER_ACTIVE_BG"
set -g pane-border-style "fg=$PANE_BORDER_INACTIVE_FG,bg=$PANE_BORDER_INACTIVE_BG,italics"

# pane title
set -g pane-border-format " #P#{?pane_active,#[fg=$PANE_ACTIVE_COLON],#[fg=$PANE_INACTIVE_COLON]}:#{?pane_active,#[fg=$PANE_ACTIVE_PATH],#[fg=$PANE_INACTIVE_PATH]}#{s/.*$USER/~/:pane_current_path}#{?pane_active,#[fg=$PANE_ACTIVE_COMMAND],#[fg=$PANE_INACTIVE_COMMAND]} #{pane_current_command} "

# ---------------------
# Prompt Colors
# ---------------------
PROMPT_BG=$PRIMARY
PROMPT_FG=$BG
set -g message-style "bg=$PROMPT_BG, fg=$PROMPT_FG"
